name: cyphernod

services:
  mongo:
    image: mongo:7.0
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping: 1}).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    # The upstream prebuilt repository is unavailable; this verified Bitnami
    # package contains the exact upstream 2025-04-22 MinIO server release.
    image: bitnamilegacy/minio:2025.4.22-debian-12-r0@sha256:a26e42a4d6550d2fb7708c8ceefc60474b42c124b6f3273a081721ddf1d86b20
    entrypoint: ["minio"]
    command: ["server", "/bitnami/minio/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-cyphernod-dev}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-cyphernod-local-only-password}
    ports:
      - "127.0.0.1:${MINIO_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "--noproxy", "*", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 30

  backend:
    build: ./BackEnd
    environment:
      PORT: "12000"
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB_NAME: ${MONGO_DB_NAME:-cyphernod}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-cyphernod-dev}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-cyphernod-local-only-password}
      S3_BUCKET: ${S3_BUCKET:-cyphernod}
      SESSION_SECURE: ${SESSION_SECURE:-false}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:5173}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-104857600}
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-12000}:12000"fin
    depends_on:
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--noproxy", "*", "--fail", "--silent", "http://127.0.0.1:12000/api/health"]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 30

  frontend:
    build: ./FrontEnd
    environment:
      API_PROXY_TARGET: http://backend:12000
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:5173"
    volumes:
      - ./FrontEnd/src:/app/src
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "--quiet", "--spider", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  mongo-data:
  minio-data:
